services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student_api
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI (browse at http://localhost:15672, guest/guest)