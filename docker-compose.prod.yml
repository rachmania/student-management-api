services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student_api
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_api -d studentdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # build: .  # option A: build from your Dockerfile
    image: student-management-api:0.0.1    # built via the Dockerfile (see README "Build the image")
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student_api
      SPRING_DATASOURCE_PASSWORD: devpassword
      SPRING_JPA_HIBERNATE_DDLAUTO: update          # env var — launcher-independent
      STUDENT_API_FIELD_KEY: ${STUDENT_API_FIELD_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"

volumes:
  pgdata: